<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>Content Studio — Concept B Workspace: The Typesetter's Galley</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            body: ['"Be Vietnam Pro"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #FFFFFF;
      color: #0D0D11;
      font-family: 'Plus Jakarta Sans', sans-serif;
      letter-spacing: -0.015em;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #0D0D11;
    }
    .btn-tactile:active {
      transform: translate(2px, 2px);
      box-shadow: none !important;
    }
  </style>
</head>
<body class="h-screen flex flex-col bg-white text-[#0D0D11] antialiased">
  <!-- Swiss Galley Top Header -->
  <header class="h-14 border-b-2 border-[#0D0D11] px-4 md:px-8 flex items-center justify-between shrink-0 bg-white">
    <div class="flex items-center space-x-4">
      <a href="index.html" class="flex items-center gap-2 font-display font-extrabold text-sm tracking-tight hover:text-[#0F3FE8] transition">
        <span class="w-6 h-6 bg-[#0F3FE8] text-white flex items-center justify-center text-xs font-mono font-bold">CS</span>
        <span>CONTENT STUDIO</span>
      </a>
      <span class="text-gray-300">/</span>
      <span class="text-xs font-mono uppercase text-gray-600 font-bold">BÀN ĐỐI SOÁT 3 CỘT (GALLEY V2)</span>
      <span class="text-[10px] font-mono px-2 py-0.5 bg-black text-white font-bold">CONCEPT B</span>
    </div>

    <div class="flex items-center space-x-4 font-mono text-xs">
      <span class="hidden sm:inline-block text-gray-500">QUOTA: <b class="text-black">18/20 CREDITS</b></span>
      <a href="index.html" class="underline hover:text-[#0F3FE8]">Trang Chủ</a>
      <button onclick="triggerSwissGenerate()" class="px-3 py-1.5 bg-[#0D0D11] text-white font-bold hover:bg-[#0F3FE8] transition shadow-[2px_2px_0px_#0F3FE8] btn-tactile">
        ĐỒNG BỘ LẠI (⌘+ENTER)
      </button>
    </div>
  </header>

  <!-- Pinned Brief Parameters Ribbon -->
  <div class="border-b-2 border-[#0D0D11] bg-[#F3F4F6] p-3 md:px-8 flex flex-col md:flex-row items-start md:items-center justify-between gap-3 text-xs font-mono shrink-0">
    <div class="flex flex-wrap items-center gap-3">
      <span class="px-2 py-0.5 bg-[#0D0D11] text-white font-bold">BRIEF HIỆN HÀNH:</span>
      <input type="text" id="bTitle" value="Áo sơ mi lụa Bảo Lộc (Nữ 22-35t · Giá 690k · Ưu đãi 15%)" class="bg-white border border-[#0D0D11] px-2 py-1 font-sans text-xs font-bold w-72 sm:w-96 focus:outline-none focus:border-[#0F3FE8]">
    </div>
    <div class="flex items-center gap-2">
      <span class="text-gray-500 uppercase">GIỌNG ĐIỆU:</span>
      <select class="bg-white border border-[#0D0D11] px-2 py-1 text-xs font-bold focus:outline-none">
        <option>Trang trọng & Quý phái</option>
        <option>Kể chuyện (Storytelling)</option>
        <option>Thuyết phục lý tính</option>
      </select>
    </div>
  </div>

  <!-- Mobile Segmented Tab Selector (Shown below md) -->
  <div class="md:hidden border-b-2 border-[#0D0D11] bg-white grid grid-cols-3 divide-x-2 divide-[#0D0D11] text-xs font-mono font-bold text-center">
    <button onclick="showMobileGalley(0)" class="m-tab active py-2.5 bg-[#0D0D11] text-white" data-m="0">
      01. PAS
    </button>
    <button onclick="showMobileGalley(1)" class="m-tab py-2.5 text-gray-700" data-m="1">
      02. AIDA
    </button>
    <button onclick="showMobileGalley(2)" class="m-tab py-2.5 text-gray-700" data-m="2">
      03. FAB
    </button>
  </div>

  <!-- 3-Column Synchronized Galley Canvas -->
  <div class="flex-1 grid grid-cols-1 md:grid-cols-3 divide-y-2 md:divide-y-0 md:divide-x-2 divide-[#0D0D11] overflow-hidden bg-white">
    
    <!-- Column 1: PAS (Vấn đề & Giải pháp) -->
    <div class="galley-col flex flex-col overflow-hidden" id="col0">
      <div class="p-3.5 border-b-2 border-[#0D0D11] bg-gray-50 flex items-center justify-between font-mono text-xs">
        <span class="font-bold text-[#E11D48] flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 bg-[#E11D48]"></span> COL 01 // PAS (VẤN ĐỀ)
        </span>
        <div class="flex items-center gap-2">
          <span class="text-gray-500">520 KÝ TỰ</span>
          <button onclick="copyGalleyCol('hook1', 'body1', 'tags1')" class="px-2 py-0.5 bg-[#0D0D11] text-white hover:bg-[#E11D48] transition font-bold btn-tactile">
            CHÉP
          </button>
        </div>
      </div>

      <div class="p-5 flex-1 overflow-y-auto custom-scroll space-y-4">
        <div>
          <label class="block font-mono text-[10px] text-gray-400 uppercase tracking-widest mb-1">TIÊU ĐỀ HOOK:</label>
          <input type="text" id="hook1" value="Áo sơ mi công sở khiến bạn bí bách cả ngày dài, ngứa cổ và nhăn nhúm sau 2 lần giặt?" class="w-full font-display font-bold text-base text-black border-b border-transparent focus:border-[#0D0D11] focus:outline-none pb-1">
        </div>

        <div>
          <label class="block font-mono text-[10px] text-gray-400 uppercase tracking-widest mb-1">NỘI DUNG CHÍNH (EDIT TRỰC TIẾP):</label>
          <textarea id="body1" rows="10" class="w-full font-body text-xs leading-[1.8] text-gray-800 focus:outline-none resize-none">Sợi tơ tằm Bảo Lộc tự nhiên 100% với cấu trúc protein thoáng khí giúp hạ nhiệt tức thì 2-3°C khi tiếp xúc với da. Kỹ thuật dệt tay giữ nếp rũ mềm mại tự nhiên, không nhăn nhúm, cho bạn vẻ chỉn chu từ cuộc họp sáng sớm đến bữa tối đối tác. Giá từ 690.000đ cùng ưu đãi 15% tuần lễ đầu ra mắt.</textarea>
        </div>

        <div>
          <label class="block font-mono text-[10px] text-gray-400 uppercase tracking-widest mb-1">THẺ HASHTAGS:</label>
          <input type="text" id="tags1" value="#AoSoMiLua #LuaToTamBaoLoc #ThoiTrangCongSo #ThanhLichTuNhien" class="w-full font-mono text-xs text-[#E11D48] focus:outline-none">
        </div>
      </div>
    </div>

    <!-- Column 2: AIDA (Cảm xúc & Khát khao) -->
    <div class="galley-col hidden md:flex flex-col overflow-hidden" id="col1">
      <div class="p-3.5 border-b-2 border-[#0D0D11] bg-gray-50 flex items-center justify-between font-mono text-xs">
        <span class="font-bold text-[#0F3FE8] flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 bg-[#0F3FE8]"></span> COL 02 // AIDA (CẢM XÚC)
        </span>
        <div class="flex items-center gap-2">
          <span class="text-gray-500">498 KÝ TỰ</span>
          <button onclick="copyGalleyCol('hook2', 'body2', 'tags2')" class="px-2 py-0.5 bg-[#0D0D11] text-white hover:bg-[#0F3FE8] transition font-bold btn-tactile">
            CHÉP
          </button>
        </div>
      </div>

      <div class="p-5 flex-1 overflow-y-auto custom-scroll space-y-4">
        <div>
          <label class="block font-mono text-[10px] text-gray-400 uppercase tracking-widest mb-1">TIÊU ĐỀ HOOK:</label>
          <input type="text" id="hook2" value="Không cần phô trương logo, chiếc áo sơ mi lụa tơ tằm dệt tay tự toát lên thần thái sang trọng, tĩnh lặng." class="w-full font-display font-bold text-base text-black border-b border-transparent focus:border-[#0D0D11] focus:outline-none pb-1">
        </div>

        <div>
          <label class="block font-mono text-[10px] text-gray-400 uppercase tracking-widest mb-1">NỘI DUNG CHÍNH (EDIT TRỰC TIẾP):</label>
          <textarea id="body2" rows="10" class="w-full font-body text-xs leading-[1.8] text-gray-800 focus:outline-none resize-none">Chạm nhẹ vào làn da mỗi sáng thứ Hai như một lời khẳng định dịu dàng về gu thẩm mỹ thượng thừa. Ánh bóng mờ tự nhiên của tơ dệt thủ công tôn vinh nét quý phái mà không cần bất kỳ sự gượng ép nào. Sở hữu ngay với mức giá khởi điểm 690.000đ (-15% tuần đầu ra mắt).</textarea>
        </div>

        <div>
          <label class="block font-mono text-[10px] text-gray-400 uppercase tracking-widest mb-1">THẺ HASHTAGS:</label>
          <input type="text" id="tags2" value="#QuietLuxury #ThoiTrangQuyPhai #LuaBaoLoc #ThanhLichTinhLang" class="w-full font-mono text-xs text-[#0F3FE8] focus:outline-none">
        </div>
      </div>
    </div>

    <!-- Column 3: FAB (Tính năng & Giá trị) -->
    <div class="galley-col hidden md:flex flex-col overflow-hidden" id="col2">
      <div class="p-3.5 border-b-2 border-[#0D0D11] bg-gray-50 flex items-center justify-between font-mono text-xs">
        <span class="font-bold text-[#059669] flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 bg-[#059669]"></span> COL 03 // FAB (TÍNH NĂNG)
        </span>
        <div class="flex items-center gap-2">
          <span class="text-gray-500">534 KÝ TỰ</span>
          <button onclick="copyGalleyCol('hook3', 'body3', 'tags3')" class="px-2 py-0.5 bg-[#0D0D11] text-white hover:bg-[#059669] transition font-bold btn-tactile">
            CHÉP
          </button>
        </div>
      </div>

      <div class="p-5 flex-1 overflow-y-auto custom-scroll space-y-4">
        <div>
          <label class="block font-mono text-[10px] text-gray-400 uppercase tracking-widest mb-1">TIÊU ĐỀ HOOK:</label>
          <input type="text" id="hook3" value="36 giờ dệt tay thủ công từ 100% kén tơ tằm tự nhiên Bảo Lộc cùng cúc xà cừ khắc chìm độc bản." class="w-full font-display font-bold text-base text-black border-b border-transparent focus:border-[#0D0D11] focus:outline-none pb-1">
        </div>

        <div>
          <label class="block font-mono text-[10px] text-gray-400 uppercase tracking-widest mb-1">NỘI DUNG CHÍNH (EDIT TRỰC TIẾP):</label>
          <textarea id="body3" rows="10" class="w-full font-body text-xs leading-[1.8] text-gray-800 focus:outline-none resize-none">Mỗi chiếc áo sở hữu mật độ dệt 16 momme tối ưu cho độ bền gấp 3 lần lụa công nghiệp, không tích điện và thân thiện với làn da nhạy cảm. Chuẩn may đo cao cấp Haute Couture bảo toàn trọn vẹn giá trị di sản thủ công Việt. Trải nghiệm ngay chỉ từ 690.000đ.</textarea>
        </div>

        <div>
          <label class="block font-mono text-[10px] text-gray-400 uppercase tracking-widest mb-1">THẺ HASHTAGS:</label>
          <input type="text" id="tags3" value="#ThuCongTruyenThong #GiaTriThat #ChatLieuTuNhien #BaoLocSilk" class="w-full font-mono text-xs text-[#059669] focus:outline-none">
        </div>
      </div>
    </div>

  </div>

  <script>
    function showMobileGalley(idx) {
      document.querySelectorAll('.galley-col').forEach((col, i) => {
        if (i === idx) {
          col.classList.remove('hidden');
          col.classList.add('flex');
        } else {
          col.classList.add('hidden');
          col.classList.remove('flex');
        }
      });
      document.querySelectorAll('.m-tab').forEach((tab, i) => {
        if (i === idx) {
          tab.className = 'm-tab active py-2.5 bg-[#0D0D11] text-white';
        } else {
          tab.className = 'm-tab py-2.5 text-gray-700 bg-white';
        }
      });
    }

    function copyGalleyCol(hId, bId, tId) {
      const hook = document.getElementById(hId).value;
      const body = document.getElementById(bId).value;
      const tags = document.getElementById(tId).value;
      navigator.clipboard.writeText(`${hook}\n\n${body}\n\n${tags}`);
      alert('Đã chép nội dung cột Galley!');
    }

    function triggerSwissGenerate() {
      alert('Đã cập nhật và sắp chữ đồng thời cả 3 cột Galley!');
    }
  </script>
</body>
</html>
